name: voyaj_workspace
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - apps/client
  - apps/server
  - packages/fr_public_data
  - packages/shared

dev_dependencies:
  lints: ^6.1.0
  melos: 7.8.1

# Base SQLite chiffrée côté client (SQLite3 Multiple Ciphers, via les hooks du package sqlite3).
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

melos:
  scripts:
    analyze:
      description: Analyse statique de tous les packages (aucun avertissement toléré).
      run: dart analyze --fatal-infos .

    format:
      description: Formate tout le code Dart.
      run: dart format .

    format:check:
      description: Vérifie le formatage (CI).
      run: dart format --output=none --set-exit-if-changed .

    gen:
      description: Génération de code (freezed, json_serializable, drift).
      run: dart run build_runner build
      exec:
        concurrency: 1
      packageFilters:
        dependsOn: build_runner

    test:dart:
      description: Tests des packages Dart purs (shared, server).
      run: dart test
      exec:
        concurrency: 1
      packageFilters:
        flutter: false
        dirExists: test

    test:flutter:
      description: Tests du client Flutter.
      run: flutter test
      exec:
        concurrency: 1
      packageFilters:
        flutter: true
        dirExists: test

    server:
      description: Lance le serveur en développement (lit apps/server/.env).
      run: cd apps/server && dart run bin/voyaj_server.dart serve

    server:migrate:
      description: Applique les migrations PostgreSQL.
      run: cd apps/server && dart run bin/voyaj_server.dart migrate

    client:
      description: Lance le client desktop Windows.
      run: cd apps/client && flutter run -d windows
