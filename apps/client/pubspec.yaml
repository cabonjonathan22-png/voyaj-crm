name: voyaj_client
description: Client desktop Voyaj CRM (Flutter).
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  collection: ^1.19.1
  drift: ^2.28.0
  drift_flutter: ^0.3.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.0.0
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  http: ^1.4.0
  intl: any
  json_annotation: ^4.12.0
  latlong2: ^0.10.1
  lucide_icons_flutter: ^3.0.0
  path: ^1.9.1
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  sqlite3: ^3.0.0
  url_launcher: ^6.3.2
  voyaj_shared: any
  web_socket_channel: ^3.0.3
  window_manager: ^0.5.0

dev_dependencies:
  build_runner: ^2.5.0
  drift_dev: ^2.28.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.0
  json_serializable: ^6.9.0
  lints: ^6.1.0
  postgres: ^3.5.6
  voyaj_server: any

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
        - asset: assets/fonts/InterVariable-Italic.ttf
          style: italic
